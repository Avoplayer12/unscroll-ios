# XcodeGen project file. Run `xcodegen generate` on a Mac (or in CI) to create Unscroll.xcodeproj.
name: Unscroll
options:
  bundleIdPrefix: com.avoplayer12
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  Unscroll:
    type: application
    platform: iOS
    sources: [Unscroll]
    scheme: {}
    info:
      path: Unscroll/Info.plist
      properties:
        CFBundleDisplayName: Unscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.avoplayer12.unscroll
            CFBundleURLSchemes: [unscroll]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avoplayer12.unscroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
